# Ubuntu/Debian: install as /etc/haproxy/haproxy.cfg after reading README.md.
# This is a complete, TLS-only TCP service, not an additional plaintext listener.
global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    maxconn 256
    maxsslconn 256
    tune.ssl.cachesize 10000
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 3s
    timeout queue 5s
    timeout client-hs 10s
    timeout client 12h
    timeout server 12h
    timeout tunnel 12h
    timeout client-fin 10s
    timeout server-fin 10s

frontend dbzc_tls
    # IPv4 only. Add an explicitly firewalled IPv6 SSL bind if required.
    bind 0.0.0.0:4001 ssl crt /etc/haproxy/certs/dbzc.pem
    maxconn 256
    # Bound concurrent connections and bursts per source (shared NATs share this).
    stick-table type ip size 100k expire 1m store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 8 }
    tcp-request connection reject if { sc_conn_rate(0) gt 20 }
    default_backend dbzc_game

backend dbzc_game
    # send-proxy is PROXY v1. Never substitute send-proxy-v2 or accept-proxy.
    # Do not add health checks that send game login traffic or expose port 4000.
    server game 127.0.0.1:4000 send-proxy maxconn 256
